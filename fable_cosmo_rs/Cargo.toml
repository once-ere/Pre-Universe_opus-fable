# The empty [workspace] table makes this crate its own workspace root, so Cargo
# does not try to attach it to the vendored engine's workspace one level up.
[workspace]

[package]
name = "fable_cosmo_rs"
version = "0.2.0"
edition = "2021"
# let-else is used in src/rhs.rs.
rust-version = "1.65"
license = "GPL-3.0-or-later"
description = "Background cosmology of the fableSpinor field: the exact bilinear dilution law, the unified dark-sector energy density and pressure, and the gpt-5.6_bridge torsion mechanism, integrated with the vendored pure-Rust SUNDIALS 7.8.0 CVODE (BDF + Newton + dense)."
publish = false

# Path dependencies into the git submodule pinned at vendor/sundials_rs; there
# are no registry dependencies.
[dependencies]
sundials_core = { path = "../vendor/sundials_rs/crates/sundials_core" }
cvode_rs = { path = "../vendor/sundials_rs/crates/cvode_rs" }

[profile.release]
opt-level = 3
